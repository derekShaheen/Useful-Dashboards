<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exacta Packout Test Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #70b0ff;
    --accent2: #00d4ff;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff4444;
    --success: #00ff88;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
  }

  @keyframes rowIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes cardIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
    gap: 14px;
  }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo-mark {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--accent);
    letter-spacing: 3px; text-transform: uppercase;
    border: 1px solid var(--accent); padding: 3px 8px;
  }
  .logo-title {
    font-size: 22px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .header-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .status-bar {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--muted); letter-spacing: 1px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .status-bar span.count { color: var(--accent2); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 8px rgba(0,255,136,.5);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .header-actions { display: flex; gap: 8px; }

  /* Main */
  .main { padding: 28px 32px; max-width: 1120px; margin: 0 auto; }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-label.spaced { margin-top: 30px; }

  /* Order cards */
  .order-card {
    margin-bottom: 14px; padding: 18px 20px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; position: relative;
    animation: cardIn .25s ease-out;
  }
  .order-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px; background: var(--accent); opacity: .45;
  }
  .order-card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 10px;
  }
  .order-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); padding: 3px 9px;
  }
  .order-guid {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--muted); letter-spacing: .5px;
  }

  .field-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-group.wide { flex: 1; min-width: 200px; }
  .field-group label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
  }

  .inp {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'Share Tech Mono', monospace;
    font-size: 13px; padding: 8px 10px; border-radius: 2px;
    outline: none; transition: border-color .2s; letter-spacing: 1px;
  }
  .inp:focus { border-color: var(--accent); }

  /* Buttons */
  .btn {
    padding: 7px 14px; border-radius: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    transition: all .15s; border: 1px solid; background: transparent;
    white-space: nowrap;
  }
  .btn-blue  { border-color: var(--accent2); color: var(--accent2); }
  .btn-blue:hover { background: var(--accent2); color: var(--bg); }
  .btn-green { border-color: var(--success); color: var(--success); }
  .btn-green:hover { background: var(--success); color: var(--bg); }
  .btn-amber { border-color: var(--danger); color: var(--danger); }
  .btn-amber:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 11px; font-size: 12px; letter-spacing: 1px; }

  .btn-red-sm {
    background: transparent; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 2px; font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 11px; cursor: pointer; transition: all .15s;
  }
  .btn-red-sm:hover { background: var(--danger); color: #fff; }

  .btn-x {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; padding: 0; border-radius: 2px; cursor: pointer; transition: all .15s;
    flex-shrink: 0;
  }
  .btn-x:hover { border-color: var(--danger); color: var(--danger); }
  .btn-x:disabled { opacity: .25; cursor: default; border-color: var(--border); color: var(--muted); }

  /* Serials */
  .serial-section { margin-top: 16px; }
  .serial-section-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .serial-list { display: flex; flex-direction: column; gap: 4px; }
  .serial-row {
    display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 2px;
    animation: rowIn .2s ease-out;
  }
  .serial-row.even { background: var(--surface2); }
  .serial-row.odd  { background: rgba(255,255,255,.02); }
  .serial-num {
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--accent2); width: 22px; text-align: center; flex-shrink: 0;
  }

  .add-serial-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; width: 100%;
    background: transparent; border: 1px dashed var(--border); border-radius: 2px;
    color: var(--muted); font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .2s; margin-top: 8px;
  }
  .add-serial-btn:hover { border-color: var(--accent); color: var(--accent); }

  .add-order-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 20px; width: 100%;
    background: transparent; border: 1px dashed var(--accent); border-radius: 2px;
    color: var(--accent); font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all .2s; margin-bottom: 6px;
  }
  .add-order-btn:hover { background: rgba(80,160,255,.1); }

  /* Output panel */
  .output-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .output-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--surface2); flex-wrap: wrap; gap: 10px;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 16px; border-radius: 2px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .15s;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .output-meta { display: flex; align-items: center; gap: 14px; }
  .msg-count {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: .5px;
  }
  .copy-btn {
    padding: 7px 18px; border-radius: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all .2s; min-width: 92px;
    background: transparent; border: 1px solid var(--accent2); color: var(--accent2);
  }
  .copy-btn:hover { background: var(--accent2); color: var(--bg); }
  .copy-btn.copied { background: var(--success); border-color: var(--success); color: var(--bg); }

  .output-pre {
    margin: 0; padding: 18px; font-size: 12.5px;
    font-family: 'Share Tech Mono', monospace;
    line-height: 1.65; color: #cfe3df;
    overflow-x: auto; max-height: 600px;
    white-space: pre-wrap; word-break: break-all;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .output-pre::-webkit-scrollbar { width: 6px; height: 6px; }
  .output-pre::-webkit-scrollbar-track { background: rgba(0,0,0,.2); }
  .output-pre::-webkit-scrollbar-thumb { background: var(--accent2); opacity:.4; }

  /* Reference */
  .ref {
    margin-top: 24px; padding: 16px 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--muted); line-height: 1.85; letter-spacing: .5px;
  }
  .ref b { color: var(--accent2); font-weight: 400; text-transform: uppercase; letter-spacing: 1.5px; }
  .ref .sep { margin: 0 10px; color: var(--border); }
  .ref .dot { margin: 0 8px; color: var(--border); }
  .ref .fld { color: var(--text); }

  input[type=number]::-webkit-inner-spin-button { opacity:.3; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">EPB</div>
    <div class="logo-title">Exacta Packout Test Builder</div>
  </div>
  <div class="header-right">
    <div class="status-bar">
      <span class="status-dot"></span> SYSTEM READY &nbsp;|&nbsp;
      <span class="count" id="statusCount">0 MESSAGES</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-green" onclick="fillSample()">Sample Data</button>
      <button class="btn btn-amber" onclick="clearAll()">Clear All</button>
    </div>
  </div>
</header>

<div class="main">
  <div class="section-label">Order Messages</div>
  <div id="orders"></div>
  <button class="add-order-btn" onclick="addOrder()">+ Add Order Message</button>

  <!-- Output -->
  <div class="section-label spaced">Output</div>
  <div class="output-panel">
    <div class="output-header">
      <div class="tabs">
        <button class="tab active" data-mode="postman" onclick="setMode('postman')">Postman</button>
        <button class="tab" data-mode="sql" onclick="setMode('sql')">SQL INSERT</button>
        <button class="tab" data-mode="json" onclick="setMode('json')">JSON Only</button>
      </div>
      <div class="output-meta">
        <span id="msgCount" class="msg-count"></span>
        <button id="copyBtn" class="copy-btn" onclick="copyOutput()">Copy</button>
      </div>
    </div>
    <pre id="output" class="output-pre"></pre>
  </div>

  <div class="ref">
    <b>Message Structure</b><span class="sep">│</span>
    Each message = 1 ITEMSTATUS record<span class="dot">·</span>
    <span class="fld">message_type</span>: ITEMSTATUS<span class="dot">·</span>
    <span class="fld">order_id</span> = <span class="fld">outbound_container_id</span> (SSCC)<span class="dot">·</span>
    <span class="fld">packed_qty</span> auto-syncs to serial count
  </div>
</div>

<script>
const state = {
  orders: [],
  mode: 'postman',
};

function uid() { return Math.random().toString(36).slice(2, 10); }
function uuid() { return crypto.randomUUID().toUpperCase(); }
function esc(s) { return (s || '').replace(/'/g, "''"); }

function now() {
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return `${mm}${dd}${yy}${hh}${mi}${ss}`;
}

function el(id) { return document.getElementById(id); }

function addOrder(data) {
  const order = data || {
    _id: uid(),
    guid: uuid(),
    order_id: '',
    container_id: '',
    location_id: 'X',
    packed_qty: 1,
    serials: [{ _id: uid(), serial_number: '' }],
  };
  state.orders.push(order);
  render();
}

function removeOrder(oid) {
  state.orders = state.orders.filter(o => o._id !== oid);
  render();
}

function duplicateOrder(oid) {
  const src = state.orders.find(o => o._id === oid);
  if (!src) return;
  const clone = {
    ...src,
    _id: uid(),
    guid: uuid(),
    serials: src.serials.map(s => ({ ...s, _id: uid() })),
  };
  const idx = state.orders.indexOf(src);
  state.orders.splice(idx + 1, 0, clone);
  render();
}

function updateOrder(oid, key, val) {
  const o = state.orders.find(o => o._id === oid);
  if (!o) return;
  o[key] = val;
  o.guid = uuid(); // new guid on any change
  renderOutput();
}

function addSerial(oid) {
  const o = state.orders.find(o => o._id === oid);
  if (!o) return;
  o.serials.push({ _id: uid(), serial_number: '' });
  o.packed_qty = o.serials.length;
  o.guid = uuid();
  render();
}

function removeSerial(oid, sid) {
  const o = state.orders.find(o => o._id === oid);
  if (!o) return;
  o.serials = o.serials.filter(s => s._id !== sid);
  o.packed_qty = o.serials.filter(s => s.serial_number.trim()).length || o.serials.length;
  o.guid = uuid();
  render();
}

function updateSerial(oid, sid, val) {
  const o = state.orders.find(o => o._id === oid);
  if (!o) return;
  const s = o.serials.find(s => s._id === sid);
  if (s) s.serial_number = val;
  o.packed_qty = o.serials.filter(s => s.serial_number.trim()).length || o.serials.length;
  o.guid = uuid();
  renderOutput();
}

function clearAll() {
  state.orders = [];
  addOrder();
}

function fillSample() {
  state.orders = [];
  addOrder({
    _id: uid(), guid: uuid(),
    order_id: '00000509460508269181',
    container_id: '',
    location_id: 'X',
    packed_qty: 2,
    serials: [
      { _id: uid(), serial_number: 'YJF0101453' },
      { _id: uid(), serial_number: 'YJF0101454' },
    ],
  });
  addOrder({
    _id: uid(), guid: uuid(),
    order_id: '00000509460508269182',
    container_id: '',
    location_id: 'X',
    packed_qty: 1,
    serials: [
      { _id: uid(), serial_number: 'YJF0101500' },
    ],
  });
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === m);
  });
  renderOutput();
}

function buildJsonForOrder(o) {
  const sscc = o.order_id.trim();
  return {
    records: [{
      message_type: 'ITEMSTATUS',
      mode: '1',
      order_id: sscc,
      line_item_id: 1,
      state: 'COMPLETED',
      location_id: o.location_id.trim() || 'X',
      outbound_container_id: sscc,
      packed_qty: o.packed_qty || o.serials.length,
      timestamp: now(),
      serial_numbers: o.serials
        .filter(s => s.serial_number.trim())
        .map(s => ({ serial_number: s.serial_number.trim() })),
    }]
  };
}

function buildSqlForOrder(o) {
  const hg = esc(o.guid);
  const jsonObj = buildJsonForOrder(o);
  const jsonStr = JSON.stringify(jsonObj, null, 2);
  const escapedJson = jsonStr.replace(/'/g, "''");

  return `INSERT INTO t_alr_import_message
    (host_group_id, insert_date, status, import_type, json, error_msg)
VALUES
(
    N'${hg}',
    GETDATE(),
    N'N',
    N'ITEMSTATUS',
    N'${escapedJson}',
    NULL
);`;
}

function buildPostmanBody() {
  // Combine every order's record into a single request body.
  const records = state.orders.flatMap(o => buildJsonForOrder(o).records);
  return {
    params: {
      json: {
        records: records
      }
    }
  };
}

function renderOutput() {
  const n = state.orders.length;
  const totalSerials = state.orders.reduce((sum, o) => sum + o.serials.length, 0);
  el('msgCount').textContent = n + ' message' + (n !== 1 ? 's' : '') + ', ' + totalSerials + ' serial' + (totalSerials !== 1 ? 's' : '');

  const sc = document.getElementById('statusCount');
  if (sc) sc.textContent = (n + ' MESSAGE' + (n !== 1 ? 'S' : ''));

  if (state.mode === 'postman') {
    el('output').textContent = JSON.stringify(buildPostmanBody(), null, 4);
  } else if (state.mode === 'json') {
    const allJson = state.orders.map(o => buildJsonForOrder(o));
    el('output').textContent = JSON.stringify(allJson, null, 2);
  } else {
    el('output').textContent = state.orders.map(o => buildSqlForOrder(o)).join('\n\n');
  }

  // Update guid displays
  state.orders.forEach(o => {
    const guidEl = document.getElementById('guid-' + o._id);
    if (guidEl) guidEl.textContent = o.guid;
  });
}

function render() {
  const container = el('orders');
  let html = '';

  state.orders.forEach((o, oi) => {
    html += `<div class="order-card">`;

    // Header
    html += `<div class="order-card-header">`;
    html += `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">`;
    html += `<span class="order-badge">Message ${oi+1}</span>`;
    html += `<span class="order-guid" id="guid-${o._id}">${o.guid}</span>`;
    html += `</div>`;
    html += `<div style="display:flex;gap:6px;">`;
    html += `<button class="btn btn-blue btn-sm" onclick="duplicateOrder('${o._id}')">Duplicate</button>`;
    const canRemove = state.orders.length > 1;
    html += `<button class="btn-red-sm" ${canRemove ? '' : 'disabled style="opacity:.3;cursor:default;"'} onclick="removeOrder('${o._id}')">Remove</button>`;
    html += `</div></div>`;

    // Fields
    html += `<div class="field-row">`;
    html += `<div class="field-group wide">`;
    html += `<label>Outbound Container SSCC</label>`;
    html += `<input class="inp" style="width:100%;" value="${o.order_id}" placeholder="e.g. 00000509460508269181" oninput="updateOrder('${o._id}','order_id',this.value)" />`;
    html += `</div>`;
    html += `<div class="field-group">`;
    html += `<label>Location</label>`;
    html += `<input class="inp" style="width:90px;" value="${o.location_id}" oninput="updateOrder('${o._id}','location_id',this.value)" />`;
    html += `</div>`;
    html += `<div class="field-group">`;
    html += `<label>Packed Qty</label>`;
    html += `<input class="inp" type="number" style="width:70px;" value="${o.packed_qty}" oninput="updateOrder('${o._id}','packed_qty',parseInt(this.value)||0)" />`;
    html += `</div>`;
    html += `</div>`;

    // Serials
    html += `<div class="serial-section">`;
    html += `<div class="serial-section-title">Serial Numbers</div>`;
    html += `<div class="serial-list">`;
    o.serials.forEach((s, si) => {
      const parity = si % 2 === 0 ? 'even' : 'odd';
      html += `<div class="serial-row ${parity}">`;
      html += `<span class="serial-num">${si+1}</span>`;
      html += `<input class="inp" style="flex:1;" value="${s.serial_number}" placeholder="e.g. YJF0101453" oninput="updateSerial('${o._id}','${s._id}',this.value)" />`;
      const canRm = o.serials.length > 1;
      html += `<button class="btn-x" ${canRm ? '' : 'disabled'} onclick="removeSerial('${o._id}','${s._id}')">×</button>`;
      html += `</div>`;
    });
    html += `</div>`;
    html += `<button class="add-serial-btn" onclick="addSerial('${o._id}')">+ Add Serial</button>`;
    html += `</div>`;

    html += `</div>`; // end card
  });

  container.innerHTML = html;
  renderOutput();
}

async function copyOutput() {
  const text = el('output').textContent;
  const btn = el('copyBtn');
  try {
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const range = document.createRange();
    range.selectNodeContents(el('output'));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy'); sel.removeAllRanges();
  }
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
}

// Start with one empty order
addOrder();
</script>
</body>
</html>
